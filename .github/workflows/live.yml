# Runs the live prediction pipeline every Monday and commits the results.
# The commit date is the proof that each risk score was saved before the
# inspection it predicts.
name: Weekly live predictions

on:
  schedule:
    - cron: "23 11 * * 1"   # Mondays, 11:23 UTC (early morning in Chicago)
  workflow_dispatch:         # also lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: live-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Install packages
        run: pip install -r requirements-live.txt

      - name: Run tests
        run: pytest -q

      - name: Score new inspections and save this week's predictions
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}   # optional
        run: python src/live.py

      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live reports/live_track_record.md
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Live predictions for $(date -u +%Y-%m-%d)"
            git push
          fi
